[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsiness"
version = "0.1.0"
description = "Real-time driver drowsiness and inattention detection from a dashcam/webcam"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "opencv-python>=4.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
drowsiness = "drowsiness.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["camera: needs a real webcam (set DROWSINESS_CAMERA_TESTS=1 to run)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsiness"
version = "0.1.0"
description = "Real-time driver drowsiness and inattention detection from a dashcam/webcam"
readme = "README.md"
requires-python = ">=3.11"
# OpenCV is an extra so GUI and headless builds can't both be pulled in: pick one.
# mediapipe is deliberately not listed: it requires opencv-contrib-python, which would
# overwrite the chosen OpenCV build. Install it with
# `pip install --no-deps -r requirements-mediapipe.txt` (its other deps are below).
dependencies = [
    "numpy>=2",
    "pyyaml>=6",
    "absl-py~=2.3",
    "certifi",
    "flatbuffers~=25.9",
    "matplotlib",
    "sounddevice~=0.5",
]

[project.optional-dependencies]
gui = ["opencv-python>=4.10"]
headless = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8", "ruff==0.17.2"]

[project.scripts]
drowsiness = "drowsiness.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drowsiness = ["*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "camera: needs a real webcam (set DROWSINESS_CAMERA_TESTS=1 to run)",
    "model: needs models/face_landmarker.task (skipped if missing unless DROWSINESS_REQUIRE_MODEL=1)",
    "perf: per-frame timing check",
]

# Default configuration. Every threshold lives here, not in code.
# Sources: docs/literature-review.md (section numbers in comments).
# Values marked "starting point" are to be tuned by data-eval-engineer (M5).

capture:
  source: 0              # camera index (int) or path to a video file
  backend: auto          # auto | msmf | dshow | any  (auto: MSMF then DSHOW on Windows)
  width: 640
  height: 480
  fps: 30.0
  buffer_size: 1         # driver-side buffer; we always process the newest frame
  read_timeout_s: 1.0    # camera gives no frame for this long -> error (never a silent stop)
  fps_override: null     # video files only: real frame rate if the file reports a wrong one

runtime:
  display: true
  max_frames: null       # stop after N frames (null = run until the source ends / 'q')
  latency_budget_ms: 50.0
  fps_window_s: 1.0      # rolling window for the displayed FPS
  log_level: INFO
  log_features: null     # path of a feature CSV to write (--log-features), null = off

calibration:
  duration_s: 5.0        # eyes open, facing forward
  min_valid_frames_ratio: 0.7
  max_attempts: 3        # then fall back to the absolute EAR threshold and zero pose offsets
  min_open_ear: 0.15     # a calibrated "open" EAR below this means eyes were not open (starting point)

eyes:
  closed_ratio: 0.2      # PERCLOS-P80: closed when EAR < closed + 0.2 * (open - closed)  (§6)
  closed_ear_fraction: 0.15  # calibration sees open eyes only: closed EAR ~ 0.15 x open
                         # (a MediaPipe blink measured ~0.03 vs open ~0.28; starting point)
  ear_fallback_closed: 0.21  # absolute threshold if calibration is skipped (starting point)
  microsleep_s: 1.5      # warning (§6)
  sleep_s: 3.0           # alarm, Euro NCAP "sleep" > 3 s (§3)

perclos:
  window_s: 60.0         # P80 over one minute (§2A)
  warning: 0.15          # starting point
  alarm: 0.25            # starting point
  min_valid_ratio: 0.5   # no PERCLOS until half the window has valid eye data

yawn:
  mar_threshold: 0.6     # starting point
  min_duration_s: 1.0
  count_window_s: 300.0
  warning_count: 3

head_nod:
  pitch_delta_deg: 15.0  # below calibrated neutral (starting point)
  min_duration_s: 1.0

distraction:
  yaw_deg: 30.0          # off calibrated neutral (starting point)
  pitch_deg: 25.0        # starting point
  long_s: 3.0            # Euro NCAP long distraction (§3)
  short_total_s: 10.0    # Euro NCAP short distraction: >= 10 s off-road ... (§3)
  short_window_s: 30.0   # ... within 30 s

no_face:
  timeout_s: 2.0

signals:
  max_gap_s: 0.3         # a missing/unknown value holds the last one for this long; after
                         # that an adverse condition (eyes closed, off-road, head down) carries
  carry_min_s: 0.5       # ...but only if it was established this long (longer than a blink)
  max_carry_s: 30.0      # ...and for at most this long without data; then NO_FACE takes over
  smoothing_s: 0.1       # median over ~3 frames removes single-frame landmark spikes

state_machine:
  clear_s: 1.0           # a condition must stay clear this long before the state drops

preprocess:
  clahe: false           # enable for low light (§2A)
  clahe_clip: 2.0
  clahe_tile: 8

perception:
  enabled: true          # false (or --no-perception) = capture-only loop
  model_path: models/face_landmarker.task  # relative to the working directory;
                         # get it with: python -m drowsiness.perception.fetch_model
  num_faces: 2           # the largest face (the driver) is kept, so tracking can't lock
                         # onto a passenger's face
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  output_blendshapes: true

overlay:                 # debug overlay drawn in the display window
  landmarks: true        # eye/mouth contours and head direction
  values: true           # EAR, MAR, pitch/yaw/roll, perception time
  logic: true            # driver state, active rules and timers (top right)
                         # --no-debug turns all three off; the alert banner always shows

alerts:                  # how logic's states/events reach the driver (milestone 4)
                         # timings are UX starting points, to check in M5
  sound: true            # false or --mute: visual only
  volume: 0.5            # (0, 1]
  sample_rate: 22050
  cooldown_s: 30.0       # the same warning reason is not sounded again within this time
  warning_repeat_s: 10.0 # chime again while a warning state persists
  alarm_repeat_s: 2.0    # sound again while DROWSY_ALARM persists
  escalation_count: 3    # sounded drowsiness warnings ...
  escalation_window_s: 300.0  # ... within this window -> alarm-style presentation
  rearm_s: 3.0           # a reason that eased must stay gone this long before its
                         # return is announced again (no alarms from a flickering signal)
  info_display_s: 3.0    # how long an INFO message (e.g. calibrated) stays up
  flash_hz: 2.0          # ALARM banner flash rate, at most 3 (photosensitivity)
  webhook_url: null      # http(s) URL to POST alerts to; null = off
  webhook_timeout_s: 2.0
